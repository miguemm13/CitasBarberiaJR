<header class="relative px-6 pt-10 pb-8 overflow-hidden">
  <div class="absolute -top-24 -right-24 w-64 h-64 bg-dorado/10 rounded-full blur-3xl"></div>

  <div class="flex items-center justify-between mb-8">
    <div class="w-11 h-11 rounded-full border border-dorado flex items-center justify-center">
      <span class="fuente-display text-dorado font-bold">N7</span>
    </div>
  </div>

  <p class="text-dorado text-xs font-semibold tracking-[0.25em] uppercase mb-2">Barbería de alta gama</p>
  <h1 class="fuente-display text-4xl font-bold leading-tight mb-3">{{ nombreBarberia }}</h1>
  <p class="text-crema/60 text-sm mb-6">{{ eslogan }}</p>

  <div class="flex items-center gap-2 text-sm text-crema/70 mb-8">
    <span aria-hidden="true">📍</span>
    <span>{{ direccion }}</span>
  </div>

  <button
    type="button"
    (click)="irAAgendar()"
    class="w-full bg-dorado hover:bg-dorado-suave text-negro-mate font-bold text-base py-4 rounded-xl shadow-lg shadow-dorado/30 transition-colors active:scale-[0.98]"
  >
    Agendar Cita
  </button>
</header>
